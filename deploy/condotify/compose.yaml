x-condotify-logging: &condotify-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: condotify-postgres
    restart: unless-stopped
    logging: *condotify-logging
    environment:
      POSTGRES_DB: Condotify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - condotify-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Condotify"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ../..
      dockerfile: CondotifyAPI/Dockerfile
    container_name: condotify-api
    restart: unless-stopped
    logging: *condotify-logging
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # 8080 e publicada na rede do proxy; 8081 serve somente api/internal/*.
      ASPNETCORE_URLS: http://+:8080;http://+:8081
      AllowedHosts: "${CONDOTIFY_PUBLIC_HOST:-fefaccess.grupoff.net.br};api;localhost"
      ReverseProxy__AllowedHost: ${CONDOTIFY_PUBLIC_HOST:-fefaccess.grupoff.net.br}
      CONDOTIFY_INTERNAL_PORT: "8081"
      CONDOTIFY_DB_CONNECTION: Host=postgres;Port=5432;Database=Condotify;Username=postgres;Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      JWTCondotify_Secret: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JWTCondotify_Issuer: Condotify
      JWTCondotify_Audience: Condotify
      CONDOTIFY_API_KEY: ${CONDOTIFY_API_KEY:?Defina CONDOTIFY_API_KEY no arquivo .env}
      CONDOTIFY_EQUIPMENT_SECRET: ${EQUIPMENT_SECRET:?Defina EQUIPMENT_SECRET no arquivo .env}
      CONDOTIFY_WALLET_SECRET: ${CONDOTIFY_WALLET_SECRET:?Defina CONDOTIFY_WALLET_SECRET no arquivo .env; use uma chave exclusiva para as credenciais Google e Apple Wallet}
      CONDOTIFY_TIME_ZONE: ${CONDOTIFY_TIME_ZONE:-America/Bahia}
      CONDOTIFY_MEDIA_SECRET: ${MEDIA_SECRET:?Defina MEDIA_SECRET no arquivo .env; ele protege as imagens privadas e agora tambem o acesso ao video ao vivo de todas as cameras}
      CONDOTIFY_PRIVATE_MEDIA_PATH: /app/data/private-media
      CONDOTIFY_BACKUP_EXPORT_SECRET: ${BACKUP_EXPORT_SECRET:?Defina BACKUP_EXPORT_SECRET no arquivo .env}
      CONDOTIFY_BACKUP_EXPORT_PATH: /app/data/backups
      CONDOTIFY_SMTP_HOST: ${CONDOTIFY_SMTP_HOST:-}
      CONDOTIFY_SMTP_PORT: ${CONDOTIFY_SMTP_PORT:-587}
      CONDOTIFY_SMTP_USERNAME: ${CONDOTIFY_SMTP_USERNAME:-}
      CONDOTIFY_SMTP_PASSWORD: ${CONDOTIFY_SMTP_PASSWORD:-}
      CONDOTIFY_SMTP_FROM_EMAIL: ${CONDOTIFY_SMTP_FROM_EMAIL:-}
      CONDOTIFY_SMTP_FROM_NAME: ${CONDOTIFY_SMTP_FROM_NAME:-Condotify}
      CONDOTIFY_SMTP_ENABLE_SSL: ${CONDOTIFY_SMTP_ENABLE_SSL:-true}
      CONDOTIFY_MEDIA_GATEWAY_URL: http://mediamtx:9997
      CONDOTIFY_MEDIA_TRANSCODE_AUDIO: ${CONDOTIFY_MEDIA_TRANSCODE_AUDIO:-true}
      CONDOTIFY_MEDIA_HLS_BASEURL: ${CONDOTIFY_MEDIA_HLS_BASEURL:-http://localhost:8888}
      CONDOTIFY_MEDIA_WEBRTC_BASEURL: ${CONDOTIFY_MEDIA_WEBRTC_BASEURL:-http://localhost:8889}
      CONDOTIFY_MEDIA_MAX_VIEWERS_PER_LICENSE: ${CONDOTIFY_MEDIA_MAX_VIEWERS_PER_LICENSE:-24}
      CONDOTIFY_LPR_OCR_URL: http://lpr-ocr:8000
      CONDOTIFY_PUBLIC_PORTAL_URL: ${CONDOTIFY_PUBLIC_PORTAL_URL:-https://fefaccess.grupoff.net.br}
      CONDOTIFY_PUBLIC_APP_URL: ${CONDOTIFY_PUBLIC_APP_URL:-https://fefaccess.grupoff.net.br}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/condotify-firebase-service-account.json
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "condotify-healthcheck", "/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    volumes:
      - condotify-private-media:/app/data/private-media
      - ${BACKUP_EXPORT_PATH:-../../backups}:/app/data/backups
      - ${FIREBASE_SERVICE_ACCOUNT_PATH:-../../secrets/condotify-firebase-service-account.json}:/run/secrets/condotify-firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - condotify-media
      - condotify-lpr
      - public-web

  mediamtx:
    image: bluenviron/mediamtx:1.9.3-ffmpeg
    container_name: condotify-mediamtx
    restart: unless-stopped
    logging: *condotify-logging
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${CONDOTIFY_MEDIA_WEBRTC_HOSTS:-localhost}
    volumes:
      - ../../mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      # Unica porta da aplicacao publicada diretamente: transporte ICE/UDP.
      - "8189:8189/udp"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - condotify-media
      - public-media

  lpr-ocr:
    build:
      context: ../../lpr-ocr
    container_name: condotify-lpr-ocr
    restart: unless-stopped
    logging: *condotify-logging
    # Uploads maiores podem ir para arquivo temporario; tmpfs garante que uma
    # imagem de camera nunca seja persistida em disco (LGPD).
    tmpfs:
      - /tmp
    networks:
      - condotify-lpr

  portal:
    build:
      context: ../..
      dockerfile: Condotify/Dockerfile
    container_name: condotify-portal
    restart: unless-stopped
    logging: *condotify-logging
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      AllowedHosts: ${CONDOTIFY_PUBLIC_HOST:-fefaccess.grupoff.net.br}
      ReverseProxy__AllowedHost: ${CONDOTIFY_PUBLIC_HOST:-fefaccess.grupoff.net.br}
      CondotifyApi__BaseUrl: http://api:8080
      CondotifyApi__ApiKey: ${CONDOTIFY_API_KEY:?Defina CONDOTIFY_API_KEY no arquivo .env}
      CONDOTIFY_TIME_ZONE: ${CONDOTIFY_TIME_ZONE:-America/Bahia}
      DataProtection__KeysPath: /app/data-protection
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "condotify-healthcheck", "/health/live"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    volumes:
      - condotify-data-protection:/app/data-protection
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - public-web

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: condotify-pgadmin
    restart: unless-stopped
    logging: *condotify-logging
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@condotify.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Defina PGADMIN_PASSWORD para habilitar o perfil tools}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - condotify-pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

networks:
  # Somente API e MediaMTX: a Control API 9997 contem credenciais de cameras.
  condotify-media:
  # Somente API e OCR, sem porta publicada.
  condotify-lpr:
  # API/portal compartilham apenas a rede de entrada HTTP com o Caddy.
  public-web:
    name: ${CONDOTIFY_WEB_NETWORK:-condotify-web}
    external: true
  # MediaMTX fica em uma segunda rede do proxy para nao expor 9997 ao portal.
  public-media:
    name: ${CONDOTIFY_MEDIA_PROXY_NETWORK:-condotify-media-proxy}
    external: true

volumes:
  condotify-postgres-data:
  condotify-pgadmin-data:
  condotify-private-media:
  condotify-data-protection:
