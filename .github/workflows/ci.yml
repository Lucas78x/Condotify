name: ci

on:
  push:
    branches: [main, master, feature/ff-access-branding]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: lucas78x

jobs:
  server-tests:
    name: server-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: Condotify
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d Condotify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ASPNETCORE_ENVIRONMENT: Production
      CONDOTIFY_DB_CONNECTION: Host=localhost;Port=5432;Database=Condotify;Username=postgres;Password=postgres
      JWTCondotify_Secret: ci-jwt-secret-with-at-least-thirty-two-characters
      CONDOTIFY_API_KEY: ci-api-key-with-at-least-thirty-two-characters
      CONDOTIFY_EQUIPMENT_SECRET: ci-equipment-secret-with-at-least-thirty-two-characters
      CONDOTIFY_MEDIA_SECRET: ci-media-secret-with-at-least-thirty-two-characters
      CONDOTIFY_WALLET_SECRET: ci-wallet-secret-with-at-least-thirty-two-characters
      CONDOTIFY_BACKUP_EXPORT_SECRET: ci-backup-secret-with-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            CondotifyAPI.Tests/*.csproj
            Condotify.Web.Tests/*.csproj
            Condotify.ApiClient.Tests/*.csproj
      - name: Apply test database migrations
        run: dotnet run --project CondotifyAPI/CondotifyAPI.csproj -c Release -- --migrate
      - name: Test API
        run: dotnet test CondotifyAPI.Tests/CondotifyAPI.Tests.csproj -c Release --logger "trx;LogFileName=api.trx"
      - name: Test portal
        run: dotnet test Condotify.Web.Tests/Condotify.Web.Tests.csproj -c Release --logger "trx;LogFileName=portal.trx"
      - name: Test API client
        run: dotnet test Condotify.ApiClient.Tests/Condotify.ApiClient.Tests.csproj -c Release --logger "trx;LogFileName=api-client.trx"
      - name: Publish server applications
        run: |
          dotnet publish CondotifyAPI/CondotifyAPI.csproj -c Release --no-restore /p:UseAppHost=false
          dotnet publish Condotify/Condotify.csproj -c Release --no-restore /p:UseAppHost=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  mobile-core-tests:
    name: mobile-core-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Condotify.Mobile.Tests/*.csproj
      - run: dotnet test Condotify.Mobile.Tests/Condotify.Mobile.Tests.csproj -c Release --logger "trx;LogFileName=mobile-core.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-core-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  lpr-ocr-tests:
    name: lpr-ocr-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install fastapi python-multipart httpx pytest
      - run: pytest lpr-ocr/tests/ -v

  compose-validation:
    name: compose-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      PGADMIN_PASSWORD: ci-pgadmin-password
      JWT_SECRET: ci-jwt-secret-with-at-least-thirty-two-characters
      CONDOTIFY_API_KEY: ci-api-key-with-at-least-thirty-two-characters
      EQUIPMENT_SECRET: ci-equipment-secret-with-at-least-thirty-two-characters
      MEDIA_SECRET: ci-media-secret-with-at-least-thirty-two-characters
      CONDOTIFY_WALLET_SECRET: ci-wallet-secret-with-at-least-thirty-two-characters
      BACKUP_EXPORT_SECRET: ci-backup-secret-with-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile ops config --quiet

  publish-images:
    name: publish-images
    needs: [server-tests, mobile-core-tests, lpr-ocr-tests, compose-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: condotify-api
            context: .
            dockerfile: CondotifyAPI/Dockerfile
          - image: condotify-portal
            context: .
            dockerfile: Condotify/Dockerfile
          - image: condotify-lpr-ocr
            context: lpr-ocr
            dockerfile: lpr-ocr/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  ci-gate:
    name: ci-gate
    if: always()
    needs: [server-tests, mobile-core-tests, lpr-ocr-tests, compose-validation, publish-images]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation and image build
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          if echo "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success")' >/dev/null; then
            echo 'All required CI jobs passed.'
          else
            echo "$NEEDS_JSON" | jq .
            exit 1
          fi
