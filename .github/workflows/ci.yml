name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWTCondotify_Secret: ci-jwt-secret-with-at-least-thirty-two-characters
      CONDOTIFY_EQUIPMENT_SECRET: ci-equipment-secret-with-at-least-thirty-two-characters
      CONDOTIFY_MEDIA_SECRET: ci-media-secret-with-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore
        run: dotnet restore Condotify.sln
      - name: Build
        run: dotnet build Condotify.sln --configuration Release --no-restore /p:UseAppHost=false
      - name: Test
        run: dotnet test CondotifyAPI.Tests/CondotifyAPI.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=tests.trx"
      - name: Validate compose
        run: docker compose config --quiet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  lpr-ocr-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        # Only the packages the tests actually import - not requirements.txt.
        # Model loading in app/recognizer.py is lazy and the tests use a fake
        # recognizer, so the heavy fast-alpr/opencv/numpy stack is never
        # imported here.
        run: pip install fastapi python-multipart httpx pytest
      - name: Test
        run: pytest lpr-ocr/tests/ -v
