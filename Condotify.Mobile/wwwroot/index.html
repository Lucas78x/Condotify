<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Condotify</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="Condotify.Mobile.styles.css" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="icon" href="data:,">
</head>
<body>
    <div class="status-bar-safe-area"></div>
    <div id="app">
        <div class="boot-screen">
            <div class="boot-mark" aria-hidden="true">
                <svg viewBox="0 0 64 64" focusable="false">
                    <rect x="2" y="2" width="60" height="60" rx="18" fill="#FFFFFF"></rect>
                    <path d="M47 18.5A20 20 0 1 0 47 45.5" fill="none" stroke="#3156D3" stroke-width="8.5" stroke-linecap="round"></path>
                    <path d="M22 44V29.5L31 24v20H22Zm11 0V30l8 4.8V44h-8Z" fill="#1C2F7A"></path>
                    <path d="M27.5 44v-7h4v7h-4Z" fill="#FFFFFF"></path>
                </svg>
            </div>
            <div class="boot-spinner" role="status" aria-label="Carregando">
                <span class="sr-only">Carregando</span>
            </div>
        </div>
    </div>
    <div id="blazor-error-ui">
        O aplicativo encontrou um erro inesperado.
        <a href="" class="reload">Recarregar</a>
        <button type="button" class="dismiss" aria-label="Fechar">Fechar</button>
    </div>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/cftv-player.js"></script>
    <script src="js/qr-scanner.js"></script>
    <script src="js/pull-to-refresh.js"></script>
</body>
</html>
